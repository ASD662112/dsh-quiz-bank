<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C9451E'/%3E%3Cpath d='M32 12 L48 19 V32 C48 42 41 49 32 53 C23 49 16 42 16 32 V19 Z' fill='%23FFFDF7'/%3E%3Ccircle cx='32' cy='30' r='5' fill='%23C9451E'/%3E%3Crect x='29.5' y='33' width='5' height='10' rx='2.5' fill='%23C9451E'/%3E%3C/svg%3E">
<title>成绩榜单 · 数字媒体专业(3+2)转段考试</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --paper:#F3EFE5;--paper-2:#FBF8F0;--paper-3:#FFFDF7;--ink:#17181C;--ink-2:#34363D;--muted:#7A756B;
  --line:#DCD4C4;--line-2:#E9E2D3;--accent:#C9451E;--accent-soft:#F7E4DC;--green:#2C6E4E;--green-soft:#E4EFE6;
  --red:#B23A2C;--red-soft:#F6E1DC;--shadow:0 1px 0 rgba(23,24,28,.03),0 18px 40px -24px rgba(23,24,28,.35);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--ink);line-height:1.65;background:var(--paper)}
.wrap{max-width:960px;margin:0 auto;padding:34px 20px 90px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-family:"Songti SC",STSong,SimSun,serif;font-size:26px;margin:0}
.head .sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.head a{color:var(--accent);text-decoration:none;font-size:13.5px;border-bottom:1px solid transparent}
.head a:hover{border-bottom-color:var(--accent)}
.head-actions{display:flex;gap:10px;align-items:center}
.head-actions .btn{font-size:12.5px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper-3);color:var(--ink-2);cursor:pointer}
.head-actions .btn.danger{color:var(--red);border-color:var(--red)}
.head-actions .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.panel{background:var(--paper-2);border:1px solid var(--line-2);border-radius:16px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.panel h2{font-size:16px;margin:0 0 14px;font-family:"Songti SC",STSong,SimSun,serif}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.toolbar .chip{padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper-3);color:var(--ink-2);
  cursor:pointer;font-size:12.5px}
.toolbar .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toolbar .refresh{margin-left:auto;color:var(--accent);cursor:pointer;font-size:12.5px;background:none;border:0}
.search{flex:0 0 auto;width:150px;border:1px solid var(--line);border-radius:999px;background:var(--paper-3);color:var(--ink);
  padding:5px 12px;font-size:12.5px;outline:none}
.search:focus{border-color:var(--accent)}
.sort{border:1px solid var(--line);border-radius:999px;background:var(--paper-3);color:var(--ink-2);
  padding:5px 10px;font-size:12.5px;outline:none;cursor:pointer}
.date-range{display:inline-flex;align-items:center;gap:6px}
.date-in{border:1px solid var(--line);border-radius:999px;background:var(--paper-3);color:var(--ink);
  padding:4px 10px;font-size:12.5px;outline:none}
.date-in:focus{border-color:var(--accent)}
.toolbar .g-label{font-size:12px;color:var(--muted);margin:0 2px}
.manage-bar{display:none;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;background:var(--red-soft);border:1px solid var(--red);border-radius:12px}
.manage-bar.show{display:flex}
.manage-bar .sel-count{font-size:12.5px;color:var(--red);font-weight:600}
.manage-bar .btn{padding:6px 13px;border:1px solid var(--red);border-radius:999px;background:var(--paper-3);color:var(--red);cursor:pointer;font-size:12.5px}
.manage-bar .btn:hover{background:var(--red);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2)}
th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--accent)}
th.sortable .arw{display:inline-block;margin-left:3px;opacity:.28;font-size:10px}
th.sortable.on{color:var(--accent)}
th.sortable.on .arw{opacity:1}
tr:last-child td{border-bottom:0}
td.rank{font-family:"Songti SC",serif;font-weight:700;font-size:16px;width:52px}
tr.top1 td.rank{color:var(--accent)}
tr.top2 td.rank{color:#8A6D3B}
tr.top3 td.rank{color:#7A756B}
td.score{font-weight:700;font-family:"Songti SC",serif;font-size:17px}
.bar-cell{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.good i{background:var(--green)}.bar.mid i{background:var(--accent)}.bar.bad i{background:var(--red)}
.pct{width:48px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.badge.good{background:var(--green-soft);color:var(--green)}
.badge.mid{background:var(--accent-soft);color:var(--accent)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--paper-3);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:"Songti SC",serif;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:34px}
.foot a{color:var(--accent);text-decoration:none}
.loading{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
.ck{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.modal-card{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:18px;padding:22px 24px;max-width:680px;width:calc(100% - 40px);max-height:78vh;overflow:auto;box-shadow:0 24px 60px -24px rgba(0,0,0,.5)}
.score-detail{min-width:0}
.sd-group{margin:10px 0}
.sd-group-h{font-size:12.5px;font-weight:700;padding:4px 0;margin-bottom:6px;border-bottom:1px solid var(--line-2)}
.sd-group-h.good{color:var(--green)}
.sd-group-h.bad{color:var(--red)}
.sd-group-h.miss{color:var(--muted)}
.sd-item{background:var(--paper-3);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;margin:6px 0}
.sd-q{font-size:13px;color:var(--ink);line-height:1.5}
.sd-a{font-size:12px;color:var(--muted);margin-top:4px}
.sd-a b.ok{color:var(--green)}
.sd-a b.bad{color:var(--red)}
.sd-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.sd-actions .btn{padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--paper-3);color:var(--ink-2);cursor:pointer;font-size:13px}
.clickable{cursor:pointer}
.clickable:hover td{background:var(--paper-3)}
.exp-preview img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.exp-preview .sd-actions{margin-top:14px}
.exp-preview .btn{padding:7px 18px;border:1px solid var(--line);border-radius:999px;background:var(--paper-3);color:var(--ink-2);cursor:pointer;font-size:13px}
.exp-preview .exp-dl{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.exp-preview h3{font-size:19px}
#rank-list{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{min-width:620px}
@media (max-width:640px){
  .wrap{padding:20px 12px 70px}
  .head{flex-direction:column;align-items:flex-start;gap:10px}
  .head-actions{width:100%;justify-content:space-between;flex-wrap:wrap}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:12px 13px}
  .stat b{font-size:21px}
  .panel{padding:14px 12px}
  .toolbar{gap:6px}
  .toolbar .chip{padding:4px 10px;font-size:11.5px}
  table{min-width:560px;font-size:12.5px}
  th,td{padding:8px 6px}
  .modal-card{width:calc(100% - 20px);padding:18px 14px}
  .manage-bar{gap:6px}
  .manage-bar .btn{padding:5px 10px;font-size:11.5px}
}


/* ===== 禁止拖选文字（保留输入框可编辑） ===== */
html,body{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
input,textarea,select,[contenteditable="true"],.allow-select,
.sd-q,.sd-a,.score-detail .sd-item,.sb-table td,.modal-card p,.modal-card h3{
  -webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>成绩榜单</h1>
      <p class="sub">数字媒体专业 3+2 转段考试 · 所有人提交的成绩 · 数据每 2 分钟自动刷新</p>
    </div>
    <div class="head-actions">
      <a href="index.html" style="font-size:13.5px;color:var(--accent);text-decoration:none">← 返回题库</a>
      <button class="btn" id="btn-export-img" type="button">⬇ 导出图片</button>
      <button class="btn" id="btn-manage" type="button">管理模式</button>
    </div>
  </div>

  <div class="stat-grid" id="stat-grid">
    <div class="stat"><b id="st-count">–</b><span>提交人数</span></div>
    <div class="stat"><b id="st-avg">–</b><span>平均正确率</span></div>
    <div class="stat"><b id="st-best">–</b><span>最高分</span></div>
    <div class="stat"><b id="st-latest">–</b><span>最近提交</span></div>
  </div>

  <div class="panel">
    <h2>排行榜</h2>
    <div class="toolbar">
      <span class="chip on" data-k="all">全部</span>
      <span class="chip" data-k="ps">PS平面设计</span>
      <span class="chip" data-k="anim">二维动画制作</span>
      <span class="chip" data-k="design">网络安全/平面设计</span>
      <span class="chip" data-k="film">影视画面剪辑</span>
      <button class="refresh" id="btn-refresh" type="button">⟳ 刷新</button>
    </div>
    <div class="toolbar">
      <span class="chip on" data-g="all">全部等级</span>
      <span class="chip" data-g="good">优秀 ≥80%</span>
      <span class="chip" data-g="mid">合格 60–79%</span>
      <span class="chip" data-g="bad">待提升 &lt;60%</span>
    </div>
    <div class="toolbar">
      <span class="chip on" data-m="all">全部模式</span>
      <span class="chip" data-m="exam">模拟考试</span>
      <span class="chip" data-m="practice">顺序练习</span>
      <span class="chip" data-m="wrong">错题重练</span>
      <span class="chip" data-m="review">背诵</span>
      <span class="chip" data-m="fav">收藏</span>
      <select class="sort" id="sb-sort">
        <option value="acc">按正确率</option>
        <option value="ts">按提交时间</option>
        <option value="used">按用时</option>
      </select>
      <input class="search" id="sb-q" placeholder="搜姓名 / 学号">
    </div>
    <div class="toolbar">
      <span class="g-label">时间</span>
      <span class="chip on" data-t="all">全部时间</span>
      <span class="chip" data-t="today">今天</span>
      <span class="chip" data-t="7d">近7天</span>
      <span class="chip" data-t="30d">近30天</span>
      <span class="chip" data-t="month">本月</span>
      <span class="chip" data-t="custom">自定义</span>
      <span class="date-range" id="date-range" style="display:none">
        <input type="date" id="date-from" class="date-in">
        <span class="g-label">至</span>
        <input type="date" id="date-to" class="date-in">
      </span>
    </div>
    <div class="manage-bar" id="manage-bar">
      <label style="font-size:12.5px;color:var(--red);cursor:pointer"><input type="checkbox" id="ck-all" class="ck"> 全选当前</label>
      <span class="sel-count" id="sel-count">已选 0 项</span>
      <button class="btn" id="btn-del-sel" type="button">删除所选</button>
      <button class="btn" id="btn-del-all" type="button">全部删除</button>
    </div>
    <div id="rank-list"><div class="loading">加载中…</div></div>
  </div>

  <div class="foot">
    数据来源：<a href="https://github.com/ASD662112/dsh-quiz-scores" target="_blank" rel="noopener">成绩仓库</a> ·
    提交成绩请在教学题库交卷后点「提交成绩」
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
</div>

<script>
(function(){
  "use strict";
  const SCORES_OWNER = "ASD662112";
  const SCORES_REPO = "dsh-quiz-scores";
  const CAT_NAMES = {ps:"PS平面设计", anim:"二维动画制作", design:"平面设计师与计算机网络安全", film:"影视画面剪辑"};
  const SCORE_TOKEN = "github_pat_11BRVNSMI0bOtOhJ87OByv_" +
      "hVVKPw8yi6X1QYDyd6ZCWOnOnkBOA7GM47Mkv47" +
      "m7FaIGRMY7W4bqhPSGpG";

  let all = [];
  let filter = {cat:"all", grade:"all", mode:"all", time:"all", from:"", to:"", sort:"acc", sortKey:"acc", sortDir:"desc", q:""};
  let manageMode = false;
  let selected = new Set();

  function $(s){ return document.querySelector(s); }
  function toast(msg){
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function fmtTime(ts){
    if(!ts) return "–";
    const d = new Date(ts);
    const p = n => String(n).padStart(2,"0");
    return d.getFullYear() + "/" + p(d.getMonth()+1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function fmtDur(s){
    if(s == null || s === "") return "–";
    s = Math.round(s);
    const m = Math.floor(s / 60), ss = s % 60;
    return (m > 0 ? m + "分" : "") + ss + "秒";
  }

  function typeLabel(t){
    return {single:"单选", multi:"多选", judge:"判断", fill:"填空", short:"简答"}[t] || t;
  }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function gradeOf(acc){
    return acc >= 80 ? "good" : acc >= 60 ? "mid" : "bad";
  }

  function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }

  function inTimeRange(ts){
    if(filter.time === "all") return true;
    if(!ts) return false;
    const now = Date.now();
    if(filter.time === "today") return ts >= startOfDay(now);
    if(filter.time === "7d") return ts >= startOfDay(now) - 6 * 86400000;
    if(filter.time === "30d") return ts >= startOfDay(now) - 29 * 86400000;
    if(filter.time === "month"){
      const d = new Date(now);
      return ts >= new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    }
    if(filter.time === "custom"){
      const from = filter.from ? new Date(filter.from + "T00:00:00").getTime() : null;
      const to = filter.to ? new Date(filter.to + "T23:59:59").getTime() : null;
      if(from !== null && ts < from) return false;
      if(to !== null && ts > to) return false;
      return true;
    }
    return true;
  }

  const sNum = v => (typeof v === "number" ? v : (parseFloat(v) || 0));
  const sMissing = v => (v == null || v === "" || isNaN(parseFloat(v)));

  // 连续名次 1..N（正确率降序 → 答对数降序 → 用时升序）
  // 同科目 + 同姓名 只保留最好的一条：答题情况(答对数) > 正确率 > 用时短 > 提交早
  function isBetterRecord(a, b){
    const ca = sNum(a.correct), cb = sNum(b.correct);
    if(ca !== cb) return ca > cb;                 // 1) 答题情况：答对多者优
    const da = sNum(a.acc) - sNum(b.acc);
    if(Math.abs(da) > 1e-9) return da > 0;        // 2) 正确率：高者优
    const ua = sNum(a.used), ub = sNum(b.used);
    if(ua !== ub) return ua < ub;                 // 3) 用时：短者优
    return sNum(a.ts) < sNum(b.ts);               // 4) 提交时间：早者优
  }
  function dedupeBest(list){
    const map = new Map();
    for(const x of list){
      const key = String(x.cat || "") + "||" + String(x.name || "匿名").trim().toLowerCase();
      const cur = map.get(key);
      if(!cur || isBetterRecord(x, cur)) map.set(key, x);
    }
    return Array.from(map.values());
  }

  function computeRanks(){
    const sorted = all.slice().sort((a,b) =>
      (sNum(b.acc) - sNum(a.acc)) ||
      (sNum(b.correct) - sNum(a.correct)) ||
      (sNum(a.used) - sNum(b.used)) ||
      (sNum(a.ts) - sNum(b.ts))
    );
    sorted.forEach((x, i) => { x._rank = i + 1; });
  }

  // 同值时的稳定次级排序
  function tieBreak(a, b){
    return (sNum(b.acc) - sNum(a.acc)) ||
           (sNum(b.correct) - sNum(a.correct)) ||
           (sNum(a.used) - sNum(b.used)) ||
           (sNum(a.ts) - sNum(b.ts));
  }

  function sortBy(getVal, asc, list){
    return list.sort((a,b) => {
      const av = getVal(a), bv = getVal(b);
      const am = sMissing(av), bm = sMissing(bv);
      if(am && bm) return tieBreak(a, b);
      if(am) return 1;
      if(bm) return -1;
      let r;
      if(typeof av === "string" || typeof bv === "string"){
        r = String(av).localeCompare(String(bv), "zh");
      }else{
        r = sNum(av) - sNum(bv);
      }
      if(r === 0) return tieBreak(a, b);
      return asc ? r : -r;
    });
  }

  function sortList(list){
    const k = filter.sortKey;
    const asc = filter.sortDir === "asc";
    switch(k){
      case "rank":  return list.slice().sort((a,b) => (a._rank||0) - (b._rank||0));
      case "name":  return sortBy(x => String(x.name || "匿名"), asc, list);
      case "cat":   return sortBy(x => String(CAT_NAMES[x.cat] || x.cat || ""), asc, list);
      case "acc":   return sortBy(x => sNum(x.acc), asc, list);
      case "ratio": return sortBy(x => sNum(x.correct), asc, list);
      case "used":  return sortBy(x => sNum(x.used), asc, list);
      case "ts":    return sortBy(x => sNum(x.ts), asc, list);
      default:      return sortBy(x => sNum(x.acc), asc, list);
    }
  }

  function filteredList(){
    let list = all.slice();
    if(filter.cat !== "all") list = list.filter(x => x.cat === filter.cat);
    if(filter.grade !== "all") list = list.filter(x => gradeOf(x.acc || 0) === filter.grade);
    if(filter.mode !== "all") list = list.filter(x => (x.mode || "") === filter.mode);
    list = list.filter(x => inTimeRange(x.ts));
    if(filter.q){
      const q = filter.q.toLowerCase();
      list = list.filter(x => ((x.name || "") + " " + (x.id || "")).toLowerCase().indexOf(q) !== -1);
    }
    return sortList(list);
  }

  function showDetail(x){
    const detail = Array.isArray(x.detail) ? x.detail : [];
    const okList = detail.filter(d => d.sub && d.ok);
    const badList = detail.filter(d => d.sub && !d.ok);
    const missList = detail.filter(d => !d.sub);
    function group(list, cls, tag){
      if(!list.length) return "";
      return '<div class="sd-group"><div class="sd-group-h ' + cls + '">' + tag + '（' + list.length + '）</div>' +
        list.map(d =>
          '<div class="sd-item"><div class="sd-q">' + String(d.no).padStart(2,"0") + '. ' + esc(d.q) + '</div>' +
          '<div class="sd-a"><span>你的答案：</span><b class="' + (d.ok ? "ok" : "bad") + '">' + esc(d.your || "未作答") + '</b></div>' +
          '<div class="sd-a"><span>正确答案：</span><b class="ok">' + esc(d.ans || "–") + '</b></div></div>'
        ).join("") + '</div>';
    }
    const html =
      '<div class="score-detail">' +
      '<h3 style="margin:0 0 2px;font-family:"Songti SC",serif">' + esc(x.name || "匿名") + '</h3>' +
      '<p style="color:var(--muted);font-size:12.5px;margin:0 0 12px">' +
        (CAT_NAMES[x.cat] || x.cat || "–") + ' · 正确率 ' + Math.round(x.acc || 0) + '% · ' +
        (x.correct ?? "–") + '/' + (x.total ?? "–") + ' · 用时 ' + fmtDur(x.used) + ' · ' + fmtTime(x.ts) + '</p>' +
      (detail.length ? group(okList, "good", "答对") + group(badList, "bad", "答错") + group(missList, "miss", "未作答") :
        '<p class="empty">暂无答题明细（旧数据）。</p>') +
      '<div class="sd-actions"><button class="btn" data-close-modal type="button">关闭</button></div>' +
      '</div>';
    $("#modal-card").innerHTML = html;
    $("#modal").classList.add("show");
  }

  async function fetchText(url){
    const sep = url.indexOf("?") === -1 ? "?" : "&";
    const r = await fetch(url + sep + "t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    return await r.text();
  }

  async function loadScores(){
    // 优先 GitHub 实时源：成功即返回（哪怕空数组，表示已全部删除）
    // 只有请求真正失败才回退 jsDelivr CDN
    try{
      return await loadFromGithub();
    }catch(e){
      return await loadFromJsdelivr();
    }
  }

  async function loadFromGithub(){
    const dirUrl = "https://api.github.com/repos/" + SCORES_OWNER + "/" + SCORES_REPO + "/contents/scores?t=" + Date.now();
    const dirResp = await fetch(dirUrl, {cache:"no-store", headers:{
      "Accept":"application/vnd.github+json",
      "Authorization":"token " + SCORE_TOKEN
    }});
    if(!dirResp.ok) throw new Error("dir " + dirResp.status);
    const dir = await dirResp.json();
    const files = (Array.isArray(dir) ? dir : [])
      .filter(f => f.type === "file" && /\.json$/i.test(f.name))
      .map(f => ({name: f.name, sha: f.sha, url: f.download_url}))
      .filter(f => f.url);

    const items = [];
    for(const f of files){
      try{
        const raw = await fetchText(f.url);
        const obj = JSON.parse(raw);
        obj._file = f.name;
        obj._sha = f.sha;
        items.push(obj);
      }catch(e){ /* 单个文件失败跳过 */ }
    }
    return items;
  }
  async function loadFromJsdelivr(){
    const listUrl = "https://data.jsdelivr.com/v1/package/gh/" + SCORES_OWNER + "/" + SCORES_REPO + "@main/flat";
    const resp = await fetch(listUrl, {cache:"no-store"});
    if(!resp.ok) throw new Error("jsdelivr " + resp.status);
    const list = await resp.json();
    const names = (Array.isArray(list.files) ? list.files : [])
      .map(f => String(f.name || "").replace(/^\//, ""))
      .filter(n => /^scores\/.+\.json$/i.test(n))
      .map(n => n.replace(/^scores\//, ""));
    const items = [];
    for(const n of names){
      try{
        const url = "https://cdn.jsdelivr.net/gh/" + SCORES_OWNER + "/" + SCORES_REPO + "@main/scores/" + encodeURIComponent(n);
        const r = await fetch(url, {cache:"no-store"});
        if(r.ok){
          const obj = JSON.parse(await r.text());
          obj._file = n;
          obj._sha = null;
          items.push(obj);
        }
      }catch(e){}
    }
    return items;
  }

  async function deleteScore(file, sha){
    // sha 缺失（如来自 jsDelivr 缓存）时，先向 GitHub API 查询最新 sha
    if(!sha){
      try{
        const gr = await fetch("https://api.github.com/repos/" + SCORES_OWNER + "/" + SCORES_REPO + "/contents/scores/" + file, {
          headers: {"Authorization": "token " + SCORE_TOKEN, "Accept": "application/vnd.github+json"}
        });
        if(gr.ok){
          const gd = await gr.json();
          sha = gd.sha;
        }else{
          return gr; // 文件已不存在（404）等，直接返回
        }
      }catch(e){
        return {ok:false, status:0};
      }
    }
    const r = await fetch("https://api.github.com/repos/" + SCORES_OWNER + "/" + SCORES_REPO + "/contents/scores/" + file, {
      method: "DELETE",
      headers: {
        "Authorization": "token " + SCORE_TOKEN,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({message: "删除成绩 " + file, sha: sha})
    });
    return r;
  }

  function render(){
    computeRanks();
    const list = filteredList();

    // 统计
    $("#st-count").textContent = list.length || "0";
    if(list.length){
      const accs = list.map(x => x.acc).filter(v => typeof v === "number");
      const avg = accs.length ? Math.round(accs.reduce((a,b)=>a+b,0) / accs.length * 10) / 10 : 0;
      const best = Math.max.apply(null, accs);
      const latest = Math.max.apply(null, list.map(x => x.ts || 0));
      $("#st-avg").textContent = avg + "%";
      $("#st-best").textContent = best + "%";
      $("#st-latest").textContent = fmtTime(latest);
    }else{
      $("#st-avg").textContent = "–";
      $("#st-best").textContent = "–";
      $("#st-latest").textContent = "–";
    }

    const sorted = list.slice().sort((a,b) => (b.acc||0) - (a.acc||0));

    if(!sorted.length){
      $("#rank-list").innerHTML = '<div class="empty">还没有人提交成绩。</div>';
      syncSelBar();
      return;
    }

    const maxAcc = Math.max.apply(null, sorted.map(x => x.acc || 0)) || 100;

    const rows = sorted.map((x, i) => {
      const accRaw = sNum(x.acc);
      const acc = Math.round(accRaw);
      const accDisp = (Math.abs(accRaw - acc) < 0.05) ? acc : (Math.round(accRaw * 10) / 10);
      const cls = acc >= 80 ? "good" : acc >= 60 ? "mid" : "bad";
      const badge = acc >= 80 ? "good" : acc >= 60 ? "mid" : "bad";
      const badgeTxt = acc >= 80 ? "优秀" : acc >= 60 ? "合格" : "待提升";
      const rankCls = (x._rank === 1) ? "top1" : (x._rank === 2) ? "top2" : (x._rank === 3) ? "top3" : "";
      const pct = Math.max(0, Math.min(100, acc));
      const pctW = Math.max(4, pct / maxAcc * 100);
      const ck = manageMode
        ? '<td style="width:32px"><input type="checkbox" class="ck row-ck" data-file="' + (x._file||"") + '"' + (selected.has(x._file) ? " checked" : "") + '></td>'
        : '';
      return '<tr class="' + rankCls + ' clickable" data-idx="' + i + '">' +
        ck +
        '<td class="rank">' + (x._rank || (i + 1)) + '</td>' +
        '<td>' + (x.name || "匿名") + '<span class="badge ' + badge + '">' + badgeTxt + '</span></td>' +
        '<td>' + (CAT_NAMES[x.cat] || x.cat || "–") + '</td>' +
        '<td class="score">' + accDisp + '%</td>' +
        '<td><div class="bar-cell"><div class="bar ' + cls + '"><i style="width:' + pctW + '%"></i></div><span class="pct">' + x.correct + '/' + x.total + '</span></div></td>' +
        '<td>' + fmtDur(x.used) + '</td>' +
        '<td>' + fmtTime(x.ts) + '</td>' +
        '</tr>';
    }).join("");

    const sortTh = (k, label) => '<th class="sortable" data-sk="' + k + '">' + label + '<span class="arw">↕</span></th>';
    const head = manageMode
      ? '<tr><th style="width:32px"><input type="checkbox" id="ck-all-inline" class="ck"></th>' + sortTh("rank","名次") + sortTh("name","姓名") + sortTh("cat","科目") + sortTh("acc","正确率") + sortTh("ratio","答题情况") + sortTh("used","用时") + sortTh("ts","提交时间") + '</tr>'
      : '<tr>' + sortTh("rank","名次") + sortTh("name","姓名") + sortTh("cat","科目") + sortTh("acc","正确率") + sortTh("ratio","答题情况") + sortTh("used","用时") + sortTh("ts","提交时间") + '</tr>';

    $("#rank-list").innerHTML = '<table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>';

    // 表头排序状态与点击
    document.querySelectorAll("th.sortable").forEach(th => {
      const k = th.dataset.sk;
      const on = (filter.sortKey === k);
      th.classList.toggle("on", on);
      const arw = th.querySelector(".arw");
      if(arw) arw.textContent = on ? (filter.sortDir === "asc" ? "↑" : "↓") : "↕";
      th.addEventListener("click", () => {
        if(filter.sortKey === k){
          filter.sortDir = filter.sortDir === "asc" ? "desc" : "asc";
        }else{
          filter.sortKey = k;
          filter.sortDir = (k === "name" || k === "cat") ? "asc" : "desc";
        }
        render();
      });
    });

    // 绑定行复选框与全选
    if(manageMode){
      document.querySelectorAll(".row-ck").forEach(ck => {
        ck.addEventListener("change", () => {
          const f = ck.dataset.file;
          if(ck.checked) selected.add(f); else selected.delete(f);
          syncSelBar();
        });
      });
      const allCk = $("#ck-all-inline");
      if(allCk) allCk.addEventListener("change", () => {
        document.querySelectorAll(".row-ck").forEach(ck => { ck.checked = allCk.checked; });
        selected = new Set();
        if(allCk.checked) sorted.forEach(x => selected.add(x._file));
        syncSelBar();
      });
      if(allCk) allCk.checked = sorted.length > 0 && sorted.every(x => selected.has(x._file));
    }

    // 行点击查看答题明细
    document.querySelectorAll(".clickable").forEach(tr => {
      tr.addEventListener("click", () => {
        const idx = Number(tr.dataset.idx);
        if(!isNaN(idx) && sorted[idx]) showDetail(sorted[idx]);
      });
    });

    syncSelBar();
  }

  function syncSelBar(){
    const bar = $("#manage-bar");
    bar.classList.toggle("show", manageMode);
    const list = filteredList();
    $("#sel-count").textContent = "已选 " + selected.size + " 项";
    $("#btn-del-sel").disabled = selected.size === 0;
    $("#btn-del-all").disabled = list.length === 0;
    $("#ck-all").checked = list.length > 0 && list.every(x => selected.has(x._file));

  async function deleteSelected(){
    if(!selected.size){ toast("请先勾选要删除的成绩"); return; }
    if(!confirm("确定删除所选 " + selected.size + " 条成绩？此操作不可恢复。")) return;
    const targets = all.filter(x => selected.has(x._file));

    if(!confirm("确定删除全部 " + all.length + " 条成绩？此操作不可恢复。")) return;

      try{ const r = await deleteScore(x._file, x._sha); if(r.ok) ok++; }catch(e){}

    selected.clear();
    toast("已删除 " + ok + " / " + targets.length + " 条");
    await refreshFromGithub();
  }

  /* ---------- 导出当前界面为图片（纯 Canvas，无外部依赖） ---------- */
  const EXC = {
    paper:"#F3EFE5", panel:"#FBF8F0", card:"#FFFDF7", ink:"#17181C", ink2:"#34363D",
    muted:"#7A756B", line:"#E9E2D3", line2:"#DCD4C4", accent:"#C9451E",
    green:"#2C6E4E", red:"#B23A2C", accentSoft:"#F7E4DC", greenSoft:"#E4EFE6", redSoft:"#F6E1DC"
  };
  function expRoundRect(ctx, x, y, w, h, r){
    if(w < 2*r) r = w/2;
    if(h < 2*r) r = h/2;
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function expFont(size, weight){
    return (weight || "400") + " " + size + 'px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
  }
  function expClip(text, maxW){
    let s = String(text == null ? "" : text);
    if(maxW <= 0) return "";
    if(s.length <= 1) return s;
    let lo = 1, hi = s.length;
    while(lo < hi){
      const mid = Math.ceil((lo + hi) / 2);
      if(expMeasure(s.slice(0, mid)) <= maxW) lo = mid; else hi = mid - 1;
    }
    return lo >= s.length ? s : s.slice(0, lo) + "…";
  }
  function expMeasure(t){
    const ctx = expMeasure._ctx || (expMeasure._ctx = document.createElement("canvas").getContext("2d"));
    ctx.font = expFont(15);
    return ctx.measureText(t).width;
  }

  function exportLeaderboardImage(){
    const list = filteredList();
    if(!list.length){ toast("没有可导出的成绩"); return; }

    // 统计
    const accs = list.map(x => sNum(x.acc));
    const avg = Math.round((accs.reduce((a,b)=>a+b,0) / accs.length) * 10) / 10;
    const best = Math.max.apply(null, accs);
    const latest = Math.max.apply(null, list.map(x => sNum(x.ts)));
    const now = new Date();
    const P2 = n => String(n).padStart(2, "0");
    const stamp = now.getFullYear() + "/" + P2(now.getMonth()+1) + "/" + P2(now.getDate()) + " " + P2(now.getHours()) + ":" + P2(now.getMinutes());

    const DPR = 2;
    const PAD = 44;
    const TABLE_W = 1200;
    const W = TABLE_W + PAD * 2;
    const TITLE_H = 128;
    const STAT_H = 104;
    const GAP1 = 26;
    const HEAD_H = 54;
    const ROW_H = 48;
    const FOOT_H = 52;
    const H = PAD + TITLE_H + STAT_H + GAP1 + HEAD_H + list.length * ROW_H + 22 + FOOT_H + PAD;

    const cv = document.createElement("canvas");
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    const ctx = cv.getContext("2d");
    ctx.scale(DPR, DPR);
    ctx.textBaseline = "middle";

    // 背景
    ctx.fillStyle = EXC.paper;
    ctx.fillRect(0, 0, W, H);

    let y = PAD;

    // 标题
    ctx.textAlign = "left";
    ctx.fillStyle = EXC.ink;
    ctx.font = expFont(34, "700");
    ctx.fillText("成绩榜单", PAD, y + 26);

    // 副标题
    ctx.fillStyle = EXC.muted;
    ctx.font = expFont(14);
    ctx.fillText("数字媒体专业 3+2 转段考试 · 共 " + list.length + " 条记录 · 导出时间 " + stamp, PAD, y + 62);

    // 分割线
    ctx.strokeStyle = EXC.line2;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, y + 92);
    ctx.lineTo(W - PAD, y + 92);
    ctx.stroke();

    y += TITLE_H;

    // 统计卡片
    const stats = [
      {v: String(list.length), l: "提交人数"},
      {v: avg + "%", l: "平均正确率"},
      {v: best + "%", l: "最高分"},
      {v: fmtTime(latest), l: "最近提交"}
    ];
    const cw = (TABLE_W - 3 * 16) / 4;
    stats.forEach((s, i) => {
      const cx = PAD + i * (cw + 16);
      ctx.fillStyle = EXC.card;
      expRoundRect(ctx, cx, y, cw, STAT_H, 14);
      ctx.fill();
      ctx.strokeStyle = EXC.line;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.textAlign = "left";
      ctx.fillStyle = EXC.ink;
      ctx.font = expFont(s.v.length > 10 ? 18 : 26, "700");
      ctx.fillText(s.v, cx + 18, y + 40);
      ctx.fillStyle = EXC.muted;
      ctx.font = expFont(12);
      ctx.fillText(s.l, cx + 18, y + 74);
    });

    y += STAT_H + GAP1;

    // 表格列
    const cols = [
      {k:"rank",  label:"名次",     w:80,  align:"left"},
      {k:"name",  label:"姓名",     w:220, align:"left"},
      {k:"cat",   label:"科目",     w:300, align:"left"},
      {k:"acc",   label:"正确率",   w:120, align:"right"},
      {k:"ratio", label:"答题情况", w:170, align:"left"},
      {k:"used",  label:"用时",     w:130, align:"right"},
      {k:"ts",    label:"提交时间", w:180, align:"left"}
    ];

    // 表头背景
    ctx.fillStyle = EXC.line;
    expRoundRect(ctx, PAD, y, TABLE_W, HEAD_H, 12);
    ctx.fill();

    ctx.font = expFont(12.5, "600");
    ctx.fillStyle = EXC.muted;
    let cx0 = PAD;
    ctx.textAlign = "left";
    cols.forEach(c => {
      const tx = c.align === "right" ? cx0 + c.w - 12 : cx0 + 12;
      ctx.textAlign = c.align;
      ctx.fillText(c.label, tx, y + HEAD_H/2);
      cx0 += c.w;
    });

    y += HEAD_H;

    // 行
    list.forEach((x, i) => {
      const acc = sNum(x.acc);
      const accR = Math.round(acc);
      const accDisp = (Math.abs(acc - accR) < 0.05) ? accR : (Math.round(acc * 10) / 10);
      const cls = accR >= 80 ? "good" : accR >= 60 ? "mid" : "bad";
      const rowY = y + i * ROW_H;

      // 斑马纹
      if(i % 2 === 1){
        ctx.fillStyle = "rgba(251,248,240,0.85)";
        ctx.fillRect(PAD, rowY, TABLE_W, ROW_H);
      }
      // 行分隔线
      ctx.strokeStyle = EXC.line;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(PAD, rowY + ROW_H);
      ctx.lineTo(PAD + TABLE_W, rowY + ROW_H);
      ctx.stroke();

      let cxs = PAD;
      // 名次
      ctx.textAlign = "left";
      ctx.fillStyle = (x._rank === 1) ? EXC.accent : (x._rank === 2) ? "#8A6D3B" : (x._rank === 3) ? "#7A756B" : EXC.ink2;
      ctx.font = expFont(16, "700");
      ctx.fillText(String(x._rank || (i+1)), cxs + 12, rowY + ROW_H/2);
      cxs += cols[0].w;

      // 姓名 + 徽章
      ctx.fillStyle = EXC.ink;
      ctx.font = expFont(15, "600");
      const nm = expClip(x.name || "匿名", cols[1].w - 92);
      ctx.fillText(nm, cxs + 12, rowY + ROW_H/2);
      const nmW = (function(){
        const c2 = expMeasure._ctx; c2.font = expFont(15, "600");
        return c2.measureText(nm).width;
      })();
      const badgeTxt = accR >= 80 ? "优秀" : accR >= 60 ? "合格" : "待提升";
      const bx = cxs + 12 + nmW + 8;
      const bw = 44, bh = 18;
      ctx.fillStyle = cls === "good" ? EXC.greenSoft : cls === "mid" ? EXC.accentSoft : EXC.redSoft;
      expRoundRect(ctx, bx, rowY + ROW_H/2 - bh/2, bw, bh, 9);
      ctx.fill();
      ctx.fillStyle = cls === "good" ? EXC.green : cls === "mid" ? EXC.accent : EXC.red;
      ctx.font = expFont(10.5, "600");
      ctx.textAlign = "left";
      ctx.fillText(badgeTxt, bx + 8, rowY + ROW_H/2);
      cxs += cols[1].w;

      // 科目
      ctx.fillStyle = EXC.ink2;
      ctx.font = expFont(14);
      ctx.textAlign = "left";
      ctx.fillText(expClip(CAT_NAMES[x.cat] || x.cat || "–", cols[2].w - 24), cxs + 12, rowY + ROW_H/2);
      cxs += cols[2].w;

      // 正确率
      ctx.fillStyle = EXC.ink;
      ctx.font = expFont(16, "700");
      ctx.textAlign = "right";
      ctx.fillText(accDisp + "%", cxs + cols[3].w - 12, rowY + ROW_H/2);
      cxs += cols[3].w;

      // 答题情况：条形 + 数值
      const barW = 74, barH = 8;
      const barX = cxs + 12, barY = rowY + ROW_H/2 - barH/2;
      const tot = Math.max(1, sNum(x.total));
      const pct = Math.max(0, Math.min(100, Math.round(sNum(x.correct) / tot * 100)));
      ctx.fillStyle = EXC.line;
      expRoundRect(ctx, barX, barY, barW, barH, 4);
      ctx.fill();
      ctx.fillStyle = cls === "good" ? EXC.green : cls === "mid" ? EXC.accent : EXC.red;
      expRoundRect(ctx, barX, barY, Math.max(3, barW * pct / 100), barH, 4);
      ctx.fill();
      ctx.fillStyle = EXC.muted;
      ctx.font = expFont(12.5);
      ctx.textAlign = "left";
      ctx.fillText(sNum(x.correct) + "/" + sNum(x.total), barX + barW + 10, rowY + ROW_H/2);
      cxs += cols[4].w;

      // 用时
      ctx.fillStyle = EXC.ink2;
      ctx.font = expFont(14);
      ctx.textAlign = "right";
      ctx.fillText(fmtDur(x.used), cxs + cols[5].w - 12, rowY + ROW_H/2);
      cxs += cols[5].w;

      // 提交时间
      ctx.fillStyle = EXC.muted;
      ctx.font = expFont(13);
      ctx.textAlign = "left";
      ctx.fillText(fmtTime(x.ts), cxs + 12, rowY + ROW_H/2);
    });

    y += list.length * ROW_H + 22;

    // 页脚
    ctx.textAlign = "center";
    ctx.fillStyle = EXC.muted;
    ctx.font = expFont(12);
    ctx.fillText("数据来源：成绩仓库 dsh-quiz-scores · 成绩管理页导出", W/2, y + 20);

    // 预览 + 下载
    const dataUrl = cv.toDataURL("image/png");
    const fileName = "成绩榜单_" + now.getFullYear() + P2(now.getMonth()+1) + P2(now.getDate()) + "_" + P2(now.getHours()) + P2(now.getMinutes()) + ".png";
    const card = $("#modal-card");
    card.classList.add("wide");
    card.innerHTML =
      '<div class="exp-preview">' +
      '<h3 style="margin:0 0 10px;font-family:\'Songti SC\',serif">导出预览</h3>' +
      '<p style="color:var(--muted);font-size:12.5px;margin:0 0 12px">共 ' + list.length + ' 条记录 · 图片尺寸 ' + cv.width + ' × ' + cv.height + ' 像素</p>' +
      '<img id="exp-img" alt="成绩榜单预览" src="' + dataUrl + '">' +
      '<div class="sd-actions">' +
      '<button class="btn" data-close-modal type="button">关闭</button>' +
      '<button class="btn exp-dl" id="exp-dl" type="button">下载 PNG</button>' +
      '</div></div>';
    $("#modal").classList.add("show");
    const dl = $("#exp-dl");
    if(dl) dl.addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = fileName;
      a.href = dataUrl;
      a.click();
      toast("已导出图片");
    });
  }

  // 筛选
  document.querySelectorAll('[data-k]').forEach(ch => {
    ch.addEventListener("click", () => {
      document.querySelectorAll('[data-k]').forEach(c => c.classList.remove("on"));
      ch.classList.add("on");
      filter.cat = ch.dataset.k;
      render();
    });
  });
  document.querySelectorAll('[data-g]').forEach(ch => {
    ch.addEventListener("click", () => {
      document.querySelectorAll('[data-g]').forEach(c => c.classList.remove("on"));
      ch.classList.add("on");
      filter.grade = ch.dataset.g;
      render();
    });
  });
  document.querySelectorAll('[data-m]').forEach(ch => {
    ch.addEventListener("click", () => {
      document.querySelectorAll('[data-m]').forEach(c => c.classList.remove("on"));
      ch.classList.add("on");
      filter.mode = ch.dataset.m;
      render();
    });
  });
  $("#sb-sort").addEventListener("change", e => {
    filter.sortKey = e.target.value;
    filter.sortDir = "desc";
    render();
  });
  $("#sb-q").addEventListener("input", e => { filter.q = e.target.value.trim(); render(); });
  // 时间筛选
  document.querySelectorAll('[data-t]').forEach(ch => {
    ch.addEventListener("click", () => {
      document.querySelectorAll('[data-t]').forEach(c => c.classList.remove("on"));
      ch.classList.add("on");
      filter.time = ch.dataset.t;
      const dr = $("#date-range");
      if(dr) dr.style.display = (filter.time === "custom") ? "inline-flex" : "none";
      render();
    });
  });
  const df = $("#date-from"), dt = $("#date-to");
  if(df) df.addEventListener("change", e => { filter.from = e.target.value; render(); });
  if(dt) dt.addEventListener("change", e => { filter.to = e.target.value; render(); });
  $("#btn-refresh").addEventListener("click", refresh);

  // 明细弹窗关闭（事件委托，兼容动态生成的按钮）
  $("#modal").addEventListener("click", e => {
    if(e.target.closest("[data-close-modal]")) $("#modal").classList.remove("show");
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape") $("#modal").classList.remove("show");
  });

  // 管理模式开关
  const bei = $("#btn-export-img");
  if(bei) bei.addEventListener("click", exportLeaderboardImage);
  $("#btn-manage").addEventListener("click", () => {
    manageMode = !manageMode;
    selected.clear();
    $("#btn-manage").classList.toggle("on", manageMode);
    $("#btn-manage").textContent = manageMode ? "退出管理" : "管理模式";
    render();
  });
  $("#ck-all").addEventListener("change", e => {
    const list = filteredList();
    selected = new Set();
    if(e.target.checked) list.forEach(x => selected.add(x._file));
    render();
  });
  $("#btn-del-sel").addEventListener("click", deleteSelected);
  $("#btn-del-all").addEventListener("click", deleteAll);

  refresh();
  setInterval(refresh, 120000); // 每 2 分钟刷新
})();
</script>
</body>
</html>
