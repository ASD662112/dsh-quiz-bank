<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字媒体专业(3+2)转段考试题库</title>
<style>
:root{
  --paper:#F3EFE5;--paper-2:#FBF8F0;--ink:#17181C;--ink-2:#34363D;--muted:#7A756B;
  --line:#DCD4C4;--accent:#C9451E;--accent-soft:#F7E4DC;--shadow:0 1px 0 rgba(23,24,28,.03),0 18px 40px -24px rgba(23,24,28,.35);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);line-height:1.65;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.12em;text-align:center}
h1{text-align:center;font-family:"Songti SC",SimSun,serif;font-size:28px;margin:10px 0 6px}
.lede{text-align:center;color:var(--muted);margin:0 0 34px;font-size:14px}
.card{display:block;background:var(--paper-2);border:1px solid var(--line);border-radius:18px;
  padding:22px 26px;margin:16px 0;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:.18s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .tag{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px;margin-bottom:10px}
.card h2{margin:0 0 8px;font-size:20px}
.card p{margin:0;color:var(--ink-2);font-size:13.5px}
.card .go{margin-top:12px;color:var(--accent);font-weight:600;font-size:14px}
.card .go::after{content:" →"}
.card.scorecard{border-color:var(--accent);background:linear-gradient(135deg,#FBF4EC,var(--paper-2))}
.card.scorecard .tag{background:var(--accent);color:#fff}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
.foot a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">数字媒体专业 · 3+2 转段考试</div>
  <h1>考试题库（网页版）</h1>
  <p class="lede">在线刷题，无需安装。进度、错题、收藏保存在你的浏览器本地。</p>

  <a class="card" href="quiz-bank-3subjects.html">
    <span class="tag">三科题库</span>
    <h2>PS 平面设计 · 二维动画制作 · 网络安全</h2>
    <p>225 + 206 + 180 题，覆盖单选/多选/判断/填空/简答，含练习、模拟考试、学习统计、导出。</p>
    <div class="go">进入三科题库</div>
  </a>

  <a class="card" href="quiz-bank-2subjects-cert.html">
    <span class="tag">二科目 + 一证书</span>
    <h2>练习题库（两科目 + 证书）</h2>
    <p>同上内容，练习入口略有差异，同样支持全部功能。</p>
    <div class="go">进入练习题库</div>
  </a>

  <a class="card scorecard" href="scores.html">
    <span class="tag">🏆 成绩榜单</span>
    <h2>查看所有人的成绩</h2>
    <p>汇总所有同学提交的考试成绩，按正确率排行；练习后交卷即可提交成绩。</p>
    <div class="go">查看成绩榜单</div>
  </a>

  <div class="foot">
    题库源码见 <a href="https://github.com/ASD662112/dsh-quiz-bank">GitHub 仓库</a>
  </div>
</div>
</body>
</html>
